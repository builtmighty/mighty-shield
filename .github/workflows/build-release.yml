name: Build Release ZIP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build plugin ZIP
        run: |
          PLUGIN_DIR="mighty-shield"
          mkdir -p "$PLUGIN_DIR"

          # Excludes come from .distignore rather than being listed here.
          #
          # They used to be four --exclude flags, which meant every other
          # development file shipped: the vendored updater, its phpcs config
          # and examples, README.md, editor state. .gitattributes had
          # export-ignore rules that looked like they covered this, but
          # export-ignore only applies to `git archive` and this builds with
          # rsync, so they did nothing.
          rsync -a --exclude="$PLUGIN_DIR" --exclude-from=.distignore . "$PLUGIN_DIR/"

          zip -r mighty-shield.zip "$PLUGIN_DIR"

      - name: Show what is shipping
        run: |
          echo "Files in the ZIP:"
          unzip -l mighty-shield.zip | tail -n 1
          echo
          echo "Anything that should not be here?"
          unzip -Z1 mighty-shield.zip | grep -E '(^|/)(\.git|\.github|node_modules|README\.md|composer\.json|phpcs\.xml)' && exit 1 || echo "  nothing unexpected"

      - name: Get latest release tag
        id: tag
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(gh release list --limit 1 --json tagName -q '.[0].tagName')" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP to release
        run: gh release upload "${{ steps.tag.outputs.tag }}" mighty-shield.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
